# cargo-deny: dependency security, licensing, and source policy.
# CI runs `cargo deny check` on every pull request.

[graph]
# Audit every optional integration, not just the default build.
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
# Every exception carries a rationale and an expiry for re-review.
ignore = [
    # rsa 0.9 (via jsonwebtoken's rust_crypto backend, feature `jwt`):
    # timing side channel in RSA *private-key* operations (decryption and
    # signing). Alloy's JWT support only verifies signatures with public
    # keys from a configured JWKS; it never loads private keys or signs.
    # No patched release exists. Re-evaluate by the expiry date or when
    # jsonwebtoken offers a backend without this crate. [expires:2026-12-26]
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; see comment [expires:2026-12-26]" },
    # crypto-bigint 0.5.5 (via jsonwebtoken 11.1.0's rust_crypto backend ->
    # p256 0.13.2 / p384 0.13.1 -> elliptic-curve 0.13.8): RUSTSEC-2026-0387,
    # timing variability in operations meant to be constant-time. Fixed only in
    # >= 0.7.6; there is no patched 0.5.x, and jsonwebtoken 11.1.0 (latest)
    # still requires p256 ^0.13. Time-boxed risk acceptance, PENDING OWNER
    # ACCEPTANCE. It is reached in two ways:
    #   - The optional `jwt` feature (also in `full`, and enabled by
    #     `ferrum-alloy new --with jwt` projects). It is not in the CLI binary
    #     or the default features. src/jwt.rs only builds `DecodingKey`s from
    #     JWKS and verifies ES256/ES384 signatures, so crypto-bigint only sees
    #     public keys and signatures.
    #   - Tests that sign ES256/ES384 with throwaway keys they generate
    #     themselves: the ferrum-alloy dev-dependency and the dev-dependency
    #     in the generated `jwt` starter.
    # No private key from a deployment ever reaches this code, so no
    # secret-dependent use is reachable in Alloy or in generated services.
    # Exit: jsonwebtoken moves to p256/p384 0.14 (elliptic-curve 0.14 /
    # crypto-bigint >= 0.7.6), or Alloy switches its backend.
    # [expires:2026-11-30]
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via jsonwebtoken rust_crypto (p256/p384 0.13); no patched 0.5.x; verification with public keys only, signing only with throwaway test keys; pending owner acceptance; see comment [expires:2026-11-30]" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only. Ferrum Alloy's own crates are unpublished
# (publish = false) and are licensed PolyForm Noncommercial 1.0.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# libfuzzer-sys bundles LLVM's libFuzzer (NCSA). It is only in the fuzz/
# crate's graph, which CI checks with `--manifest-path fuzz/Cargo.toml`, and
# it is never linked into Alloy or a generated project.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Keep the crypto stack on ring; OpenSSL and aws-lc are not used.
deny = [
    { crate = "openssl-sys", reason = "TLS uses rustls with the ring provider" },
    { crate = "aws-lc-sys", reason = "TLS uses rustls with the ring provider" },
    { crate = "native-tls", reason = "TLS uses rustls with the ring provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
