# cargo-deny: dependency security, licensing, and source policy.
# CI runs `cargo deny check` on every pull request.

[graph]
# Audit every optional integration, not just the default build.
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
# Every exception carries a rationale and an expiry for re-review: a `reason`
# with exactly one `[expires:YYYY-MM-DD]` token. cargo-deny does not read that
# token; ci/check_advisory_expiry.py does, before cargo-deny in the CI
# dependency-policy job and the weekly advisories workflow, and fails on a
# missing, malformed, or past date.
ignore = [
    # rsa 0.9 (via jsonwebtoken's rust_crypto backend, feature `jwt`):
    # timing side channel in RSA *private-key* operations (decryption and
    # signing). Alloy's JWT support only verifies signatures with public
    # keys from a configured JWKS; it never loads private keys or signs.
    # No patched release exists. Re-evaluate by the expiry date or when
    # jsonwebtoken offers a backend without this crate. [expires:2026-12-26]
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; see comment [expires:2026-12-26]" },
    # crypto-bigint 0.5.5 (via jsonwebtoken 11.1.0's rust_crypto backend ->
    # p256 0.13.2 / p384 0.13.1 -> elliptic-curve 0.13.8): RUSTSEC-2026-0387,
    # timing variability in operations meant to be constant-time. Fixed only in
    # >= 0.7.6; there is no patched 0.5.x, and jsonwebtoken 11.1.0 (latest)
    # still requires p256 ^0.13. Time-boxed risk acceptance, PENDING OWNER
    # ACCEPTANCE. It is reached in two ways:
    #   - The optional `jwt` feature (also in `full`, and enabled by
    #     `ferrum-alloy new --with jwt` projects). It is not in the CLI binary
    #     or the default features. src/jwt.rs only builds `DecodingKey`s from
    #     JWKS and verifies ES256/ES384 signatures, so crypto-bigint only sees
    #     public keys and signatures.
    #   - Tests that sign ES256/ES384 with throwaway keys they generate
    #     themselves: the ferrum-alloy dev-dependency and the dev-dependency
    #     in the generated `jwt` starter.
    # No private key from a deployment ever reaches this code, so no
    # secret-dependent use is reachable in Alloy or in generated services.
    # Exit: jsonwebtoken moves to p256/p384 0.14 (elliptic-curve 0.14 /
    # crypto-bigint >= 0.7.6), or Alloy switches its backend.
    # jsonwebtoken's only other backend, `aws_lc_rs`, would remove the crate
    # today, but `aws-lc-sys` is banned below (the crypto stack stays on
    # ring), so that is a policy change for the owner, not a drop-in fix.
    # Installing a ring-backed jsonwebtoken CryptoProvider instead would mean
    # a process-global install from library code, which AGENTS.md forbids.
    # [expires:2026-11-30]
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via jsonwebtoken rust_crypto (p256/p384 0.13); no patched 0.5.x; verification with public keys only, signing only with throwaway test keys; pending owner acceptance; see comment [expires:2026-11-30]" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only. Ferrum Alloy's own crates are unpublished
# (publish = false) and are licensed PolyForm Noncommercial 1.0.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# libfuzzer-sys bundles LLVM's libFuzzer (NCSA). It is only in the fuzz/
# crate's graph, which CI checks with `--manifest-path fuzz/Cargo.toml`, and
# it is never linked into Alloy or a generated project.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
ignore = true

[bans]
# A crate in the graph at two or more versions fails the check, so a new
# duplicate is a reviewed decision rather than a silent warning. Every
# accepted duplicate below names the split that causes it. Entries match
# by crate name only, so patch bumps on either side need no edit; remove
# an entry once the workspace graph holds one version again (cargo-deny
# warns about an entry that no longer matches). The fuzz crate's smaller
# graph shares this file, so it reports unmatched and unnecessary skips as
# warnings; only the workspace check decides when to remove an entry.
# Re-check with `cargo deny check bans`.
multiple-versions = "deny"
skip = [
    # RustCrypto 0.10 -> 0.11 split. jsonwebtoken's rust_crypto backend
    # (rsa, p256/p384 0.13, ed25519-dalek) and sha1 stay on digest 0.10;
    # sqlx 0.9 (feature `postgres`) moved to digest/sha2/hmac/hkdf 0.11.
    { crate = "block-buffer", reason = "RustCrypto digest 0.10/0.11 split (jsonwebtoken vs sqlx)" },
    { crate = "cpufeatures", reason = "RustCrypto digest 0.10/0.11 split (jsonwebtoken vs sqlx)" },
    { crate = "crypto-common", reason = "RustCrypto digest 0.10/0.11 split (jsonwebtoken vs sqlx)" },
    { crate = "digest", reason = "RustCrypto digest 0.10/0.11 split (jsonwebtoken vs sqlx)" },
    { crate = "hkdf", reason = "RustCrypto digest 0.10/0.11 split (jsonwebtoken vs sqlx)" },
    { crate = "hmac", reason = "RustCrypto digest 0.10/0.11 split (jsonwebtoken vs sqlx)" },
    { crate = "sha2", reason = "RustCrypto digest 0.10/0.11 split (jsonwebtoken vs sqlx)" },
    # rand 0.8 (jsonwebtoken, rsa), 0.9 (opentelemetry, axum, tungstenite)
    # and 0.10 (Alloy, proptest, sqlx), with their cores and OS backends.
    { crate = "getrandom", reason = "rand 0.8/0.9/0.10 split across jsonwebtoken, opentelemetry and sqlx" },
    { crate = "r-efi", reason = "getrandom 0.3/0.4 split (rand ecosystem)" },
    { crate = "rand", reason = "rand 0.8/0.9/0.10 split across jsonwebtoken, opentelemetry and sqlx" },
    { crate = "rand_chacha", reason = "rand 0.8/0.9 split (jsonwebtoken vs opentelemetry)" },
    { crate = "rand_core", reason = "rand 0.8/0.9/0.10 split across jsonwebtoken, opentelemetry and sqlx" },
    # Proc-macro crates still on syn 2 while most of the graph uses syn 3.
    { crate = "syn", reason = "syn 2/3 split among proc-macro dependencies" },
    { crate = "synstructure", reason = "syn 2/3 split among proc-macro dependencies" },
    # sqlx-core uses base64 0.22 and hashbrown 0.16 (via hashlink); axum,
    # reqwest and indexmap use base64 0.23 and hashbrown 0.17.
    { crate = "base64", reason = "sqlx-core on base64 0.22; axum, reqwest and rcgen on 0.23" },
    { crate = "hashbrown", reason = "sqlx hashlink on hashbrown 0.16; indexmap on 0.17" },
    # reqwest and opentelemetry-otlp use tower-http 0.6; Alloy uses 0.7.
    { crate = "tower-http", reason = "reqwest and opentelemetry-otlp on tower-http 0.6; Alloy on 0.7" },
    # cap-std's fs-set-times is on io-lifetimes 2; cap-primitives on 3.
    { crate = "io-lifetimes", reason = "fs-set-times on io-lifetimes 2; cap-primitives on 3" },
    # errno, ring and others are on windows-sys 0.52; most of the graph 0.61.
    { crate = "windows-sys", reason = "errno, ring and others on windows-sys 0.52; most crates on 0.61" },
]
wildcards = "deny"
allow-wildcard-paths = true
# Keep the crypto stack on ring; OpenSSL and aws-lc are not used.
deny = [
    { crate = "openssl-sys", reason = "TLS uses rustls with the ring provider" },
    { crate = "aws-lc-sys", reason = "TLS uses rustls with the ring provider" },
    { crate = "native-tls", reason = "TLS uses rustls with the ring provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
