[package]
name = "example-edge-observability"
description = "Ferrum Alloy behind a real Ferrum Edge gateway with mTLS and OTLP export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "edge-demo-api"
path = "src/main.rs"

[[bin]]
name = "gen-demo-certs"
path = "src/bin/gen_demo_certs.rs"

[[bin]]
name = "edge-e2e"
path = "src/bin/edge_e2e.rs"

[dependencies]
ferrum-alloy = { workspace = true, features = ["otel", "tls", "edge"] }
ferrum-alloy-diagnostics = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1", "json", "matched-path"] }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true, features = ["channel"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true, features = ["crypto", "ring", "pem"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "process"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[lints]
workspace = true
