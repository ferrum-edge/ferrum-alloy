# Ferrum Edge -> Ferrum Alloy -> instrumented dependency, with both
# exporting to an OpenTelemetry Collector. No host bind mounts: all inputs
# are baked into images so this runs the same locally and in CI.
#
#   docker compose -f examples/edge-observability/compose.yaml up -d --build
#   cargo run -p example-edge-observability --bin edge-e2e -- \
#     --compose examples/edge-observability/compose.yaml --out target/e2e
name: ferrum-alloy-edge-e2e

x-build: &build
  context: ../..
  dockerfile: examples/edge-observability/Dockerfile

services:
  otel-collector:
    build: { <<: *build, target: collector }

  alloy:
    build: { <<: *build, target: alloy }
    depends_on: [otel-collector]
    ports:
      # Direct access from the host, used only to prove bypass rejection.
      - "127.0.0.1:18443:8443"
    networks:
      default:
        # A second name for Alloy that only the e2e-reuse proxy uses, so its
        # first request needs a new gateway connection (see
        # src/bin/gen_e2e_edge_config.rs).
        aliases: [alloy-reuse]

  edge:
    # EDGE_IMAGE, when set in the environment, overrides the Dockerfile's
    # default Edge image (CI's support-window matrix).
    build: { <<: *build, target: edge, args: [EDGE_IMAGE] }
    depends_on: [alloy, otel-collector]
    environment:
      FERRUM_MODE: file
      FERRUM_FILE_CONFIG_PATH: /config/edge.yaml
      FERRUM_PROXY_BIND_ADDRESS: 0.0.0.0
      FERRUM_ADMIN_HTTP_PORT: "0"
      FERRUM_LOG_LEVEL: info
      # Deterministic connection cases for edge-e2e: no connection is opened
      # before the first request, and each backend host gets one HTTP/2
      # connection that concurrent requests multiplex over.
      FERRUM_POOL_WARMUP_ENABLED: "false"
      FERRUM_POOL_HTTP2_CONNECTIONS_PER_HOST: "1"
      # Gateway diagnostic references (Edge v0.9.9 and later; off by default):
      # every response with a gateway X-Gateway-Error token carries
      # X-Ferrum-Diagnostic-Ref, which edge-e2e checks on the refused
      # connection. v0.9.8 does not read this variable.
      FERRUM_DIAGNOSTIC_REFS: errors
    ports:
      - "127.0.0.1:18000:8000"
