[package]
name = "example-bench"
description = "Overhead benchmark: plain Axum versus Ferrum Alloy configurations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alloy-bench"
path = "src/main.rs"

[dependencies]
ferrum-alloy = { workspace = true, features = ["otel"] }
axum = { workspace = true, features = ["tokio", "http1", "http2", "json"] }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1", "http2"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["std", "registry", "fmt", "json"] }

[lints]
workspace = true
