[package]
name = "example-bench"
description = "Overhead benchmark: plain Axum versus Ferrum Alloy configurations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alloy-bench"
path = "src/main.rs"

[dependencies]
ferrum-alloy = { workspace = true, features = ["otel", "tls"] }
axum = { workspace = true, features = ["tokio", "http1", "http2", "json"] }
bytes = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto", "service", "http1", "http2"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
rcgen = { workspace = true, features = ["crypto", "ring", "pem"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["std", "registry", "fmt", "json"] }

[dev-dependencies]
toml = { workspace = true, features = ["parse", "serde"] }

# The workspace lints, restated because the workspace forbids unsafe code and
# this binary needs exactly one exception: its counting global allocator
# (`src/alloc.rs`). `unsafe_code` is `deny` here so that its `GlobalAlloc` impl
# alone can expect it. A test in `src/alloc.rs` fails if the rest drifts from
# `[workspace.lints]` in the root manifest.
[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
