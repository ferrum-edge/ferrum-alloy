[package]
name = "ferrum-alloy-edge"
description = "Optional Ferrum Edge trust and diagnostic contract adapter for Ferrum Alloy services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Parse verified peer certificates (SPIFFE URI SAN / DNS SAN) from rustls.
tls = ["dep:x509-parser", "dep:rustls-pki-types"]

[dependencies]
ferrum-alloy-telemetry = { workspace = true }
ferrum-alloy-diagnostics = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tower-layer = { workspace = true }
tower-service = { workspace = true }
tracing = { workspace = true, features = ["std"] }
ipnet = { workspace = true, features = ["serde"] }
x509-parser = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
rcgen = { workspace = true, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true
