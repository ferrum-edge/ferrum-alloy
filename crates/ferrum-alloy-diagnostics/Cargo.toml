[package]
name = "ferrum-alloy-diagnostics"
description = "Versioned, language-neutral diagnostic evidence schema and deterministic rules for Ferrum Alloy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["diagnostics", "tracing", "latency", "opentelemetry", "evidence"]
categories = ["development-tools::debugging"]
