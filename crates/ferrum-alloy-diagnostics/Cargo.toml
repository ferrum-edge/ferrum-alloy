include = ["/src/**", "/README.md", "/LICENSE", "/LICENSE-COMMERCIAL.md"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
