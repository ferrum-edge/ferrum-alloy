name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Property tests draw the same cases on every run, so a failure reproduces.
  # Explore other cases locally with a different or unset seed (docs/testing.md).
  PROPTEST_RNG_SEED: "20260927"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: AGENTS.md matches CLAUDE.md
        # The same agent guide under the two names agents look for. A regular
        # copy rather than a symlink, which Windows checkouts turn into a
        # small text file.
        if: ${{ !cancelled() }}
        run: cmp AGENTS.md CLAUDE.md

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # Preserve the required status contexts configured in the main ruleset.
    # The display names are historical; runs-on pins each runner image.
    name: Test (${{ matrix.context }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            context: ubuntu-latest
          - os: macos-26
            context: macos-latest
          - os: windows-2025
            context: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tests (all features)
        run: cargo test --workspace --all-features --locked
      - name: Tests (default features)
        if: ${{ !cancelled() }}
        # The benchmark's fixed-window real-service tests (about 145 s, the
        # longest in the workspace) ran in the step above. `plain` has no
        # Alloy code, and the default `alloy` stack enables none of the
        # features this step drops, so a second run tests the same code
        # (docs/benchmarks.md#functional-health-tests).
        run: cargo test --workspace --locked -- --skip run::tests::plain_serves_every_workload_over_every_transport --skip run::tests::alloy_serves_every_workload_over_every_transport --skip run::tests::cancellation_remains_healthy_after_normal_warmup

  features:
    name: Feature combinations
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Independently usable crates
        run: |
          set -euxo pipefail
          cargo check --locked -p ferrum-alloy-diagnostics --all-targets
          # Every target of the telemetry crate, including its tests, must
          # build, lint, and pass with each feature alone.
          cargo clippy --locked -p ferrum-alloy-telemetry --all-targets --no-default-features -- -D warnings
          cargo test --locked -p ferrum-alloy-telemetry --no-default-features
          for feature in axum subscriber x509 otel; do
            cargo clippy --locked -p ferrum-alloy-telemetry --all-targets --no-default-features --features "$feature" -- -D warnings
            cargo test --locked -p ferrum-alloy-telemetry --no-default-features --features "$feature"
          done
          cargo clippy --locked -p ferrum-alloy-telemetry --all-targets --features otel -- -D warnings
          cargo clippy --locked -p ferrum-alloy-edge --all-targets --no-default-features -- -D warnings
          cargo test --locked -p ferrum-alloy-edge --no-default-features
      - name: Each optional integration alone
        # The library alone first: building tests also enables
        # dev-dependency features (tokio "full", for one), which would hide
        # a library that relies on a dependency feature it does not request.
        # Then --all-targets, so a feature-gated test, example, or bench that
        # only builds with every feature on fails here too.
        run: |
          set -euxo pipefail
          cargo check --locked -p ferrum-alloy --no-default-features
          cargo check --locked -p ferrum-alloy --all-targets --no-default-features
          for feature in otel edge tls postgres openapi openapi-ui jwt http-client compression cors diagnostics; do
            cargo check --locked -p ferrum-alloy --no-default-features --features "$feature"
            cargo check --locked -p ferrum-alloy --all-targets --no-default-features --features "$feature"
          done
          cargo check --locked -p ferrum-alloy --features full
          cargo check --locked -p ferrum-alloy --all-targets --features full
      - name: Minimal build has no optional batteries
        run: |
          set -euxo pipefail
          tree=$(cargo tree --locked -p ferrum-alloy --no-default-features -e normal --prefix none)
          for forbidden in sqlx jsonwebtoken utoipa reqwest opentelemetry rustls ferrum-alloy-edge ferrum-alloy-diagnostics; do
            if grep -q "^$forbidden " <<<"$tree"; then
              echo "::error::$forbidden is in the minimal dependency graph"
              exit 1
            fi
          done

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build every target and the tests (all features)
        run: cargo +1.94.0 test --workspace --all-targets --all-features --locked --no-run
      - name: Build every target and the tests (default features)
        run: cargo +1.94.0 test --workspace --all-targets --locked --no-run
      - name: Each library alone with its default features
        # Workspace builds unify features across members (the examples turn
        # most of Alloy's integrations on), so check each library on its own,
        # as a downstream consumer with default features builds it.
        run: |
          set -euxo pipefail
          for crate in ferrum-alloy-diagnostics ferrum-alloy-telemetry ferrum-alloy-edge ferrum-alloy ferrum-alloy-cli; do
            cargo +1.94.0 check --locked -p "$crate"
          done

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The CLI's binary is also named `ferrum-alloy`; documenting it next to
      # the library collides on the output path, and a binary has no public
      # API to document.
      - run: cargo doc --workspace --exclude ferrum-alloy-cli --all-features --no-deps --locked

  semver-baseline:
    name: Semver baseline
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.baseline.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags and the history between them: the baseline is the newest
          # v1.* release tag reachable from the commit under test.
          fetch-depth: 0
      - name: Find the baseline release
        id: baseline
        # Semantic versioning of the library crates' public API starts with
        # 1.0.0. Until a v1.* release tag exists there is no released 1.x API
        # to compare with, and the 0.x API is not covered, so the comparison
        # jobs are skipped with a notice. They start with the v1.0.0 tag,
        # without editing this workflow. A lookup that cannot see the history
        # or the tags fails instead of looking like "no release yet".
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::the checkout is shallow, so release tags cannot be looked up"
            exit 1
          fi
          # Every release so far is reachable from main (v0.1.0 at least), so
          # an empty list means the tags were not fetched.
          releases=$(git tag --merged HEAD --list 'v[0-9]*')
          if [ -z "$releases" ]; then
            echo "::error::no release tag is reachable from $(git rev-parse --short HEAD); the checkout did not fetch tags"
            exit 1
          fi
          tag=$(printf '%s\n' "$releases" | awk '/^v1\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)
          if [ -z "$tag" ]; then
            echo "::notice title=Semver checks skipped::No v1.* release tag is reachable from $(git rev-parse --short HEAD), so there is no released 1.x API to compare with. The check starts with the v1.0.0 tag."
          else
            echo "Baseline: $tag at $(git rev-list -n 1 "$tag")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  semver:
    name: Semver checks (${{ matrix.package }})
    needs: semver-baseline
    if: needs.semver-baseline.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        # The library crates. The CLI is a binary with no library API.
        package:
          - ferrum-alloy-diagnostics
          - ferrum-alloy-telemetry
          - ferrum-alloy-edge
          - ferrum-alloy
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Every feature configuration against ${{ needs.semver-baseline.outputs.tag }}
        # The public API is covered under every combination of documented
        # Cargo features. This compares default features, no default
        # features, all features, and each feature alone (except `full`,
        # which --all-features covers); a feature added since the baseline
        # is compared only within --all-features. A change merged to main
        # must be releasable as a 1.x minor release: breaking changes need a
        # new major version. Every crate is `publish = false`, which
        # --workspace skips, so the crate is named.
        env:
          BASELINE: ${{ needs.semver-baseline.outputs.tag }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          manifest="crates/$PACKAGE/Cargo.toml"
          if ! git cat-file -e "$BASELINE:$manifest" 2> /dev/null; then
            echo "::notice title=Semver checks ($PACKAGE)::$PACKAGE is not in $BASELINE, so it has no released API to compare with."
            exit 0
          fi
          features() {
            python3 -I -c 'import sys, tomllib; f = tomllib.load(sys.stdin.buffer).get("features", {}); print(" ".join(sorted(k for k in f if k not in ("default", "full"))))'
          }
          has_default_features() {
            python3 -I -c 'import sys, tomllib; sys.exit(0 if tomllib.load(sys.stdin.buffer).get("features", {}).get("default") else 1)'
          }
          current=$(features < "$manifest")
          released=$(git show "$BASELINE:$manifest" | features)
          configs=("--default-features" "--all-features")
          if has_default_features < "$manifest"; then
            configs+=("--only-explicit-features")
          fi
          for feature in $current; do
            if [[ " $released " == *" $feature "* ]]; then
              configs+=("--only-explicit-features --features $feature")
            else
              echo "::notice title=Semver checks ($PACKAGE)::feature $feature is new since $BASELINE; it is compared only within --all-features"
            fi
          done
          failed=()
          for config in "${configs[@]}"; do
            echo "::group::$PACKAGE $config"
            # Word splitting of $config is intended: it holds the flags.
            # shellcheck disable=SC2086
            if ! cargo semver-checks --package "$PACKAGE" --baseline-rev "$BASELINE" --release-type minor $config; then
              failed+=("$config")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            for config in "${failed[@]}"; do
              echo "::error title=Semver checks ($PACKAGE)::not releasable as a 1.x minor release with $config"
            done
            exit 1
          fi

  generator:
    name: Generated projects
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: alloy
          POSTGRES_PASSWORD: alloy
          POSTGRES_DB: alloy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alloy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      FERRUM_ALLOY_TEST_DATABASE_URL: postgres://alloy:alloy@127.0.0.1:5432/alloy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Generate, build, and test starter projects
        run: cargo test --locked -p ferrum-alloy-cli --test cli -- --ignored --nocapture

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: alloy
          POSTGRES_PASSWORD: alloy
          POSTGRES_DB: alloy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alloy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      FERRUM_ALLOY_TEST_DATABASE_URL: postgres://alloy:alloy@127.0.0.1:5432/alloy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Database tests
        run: cargo test --locked -p ferrum-alloy --features postgres --test postgres -- --include-ignored
      - name: Example CRUD service against the database
        run: cargo test --locked -p example-postgres-api -- --include-ignored

  openapi-ui-browser:
    name: OpenAPI UI in a real browser
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SMOKE_OUT: target/browser-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: ci/browser-smoke/package-lock.json
      - name: Install Playwright from the lockfile
        # No install scripts and no browser download: the tests drive the
        # runner's preinstalled Google Chrome (channel "chrome").
        working-directory: ci/browser-smoke
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts
          google-chrome --version
      - name: Build the smoke server
        run: cargo build --locked -p example-openapi-ui
      - name: Start the smoke server
        # examples/openapi-ui/alloy.toml: the application listener on
        # 127.0.0.1:18080 and the management listener on 127.0.0.1:19090.
        env:
          # A throwaway credential for the smoke server's management listener,
          # which listens on this runner's loopback only. Set only on the two
          # steps that need it.
          FERRUM_ALLOY_MANAGEMENT_TOKEN: browser-smoke-management-token-0123456789
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_OUT"
          ./target/debug/example-openapi-ui > "$SMOKE_OUT/server.log" 2>&1 &
          echo "$!" > "$SMOKE_OUT/server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/readyz \
              && curl -fsS -o /dev/null http://127.0.0.1:19090/livez; then
              exit 0
            fi
            if ! kill -0 "$(cat "$SMOKE_OUT/server.pid")" 2> /dev/null; then
              cat "$SMOKE_OUT/server.log"
              echo "::error::the smoke server exited"
              exit 1
            fi
            sleep 1
          done
          cat "$SMOKE_OUT/server.log"
          echo "::error::the smoke server did not become ready"
          exit 1
      - name: Load the documentation UI in Google Chrome
        working-directory: ci/browser-smoke
        env:
          FERRUM_ALLOY_MANAGEMENT_TOKEN: browser-smoke-management-token-0123456789
        run: npm test
      - name: Stop the smoke server
        if: always()
        run: |
          if [ -f "$SMOKE_OUT/server.pid" ]; then
            kill "$(cat "$SMOKE_OUT/server.pid")" 2> /dev/null || true
          fi
      - name: Upload screenshots and report
        # On success and on failure. Failure traces include the throwaway
        # token above, nothing else secret.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-ui-browser-smoke
          path: |
            ci/browser-smoke/screenshots/
            ci/browser-smoke/test-results/
            ci/browser-smoke/playwright-report/
            target/browser-smoke/server.log
          if-no-files-found: warn

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - name: Advisory-exception expiry
        # cargo-deny ignores the [expires:YYYY-MM-DD] token in an ignore's
        # reason, so this checker enforces it: a missing, malformed, or past
        # deadline fails before cargo-deny runs. Its tests run first so a
        # checker that stopped rejecting bad entries cannot pass silently.
        run: |
          python3 -I -m unittest discover -s ci/tests -p 'test_*.py' -v
          python3 -I ci/check_advisory_expiry.py
      - run: cargo deny check
      - name: Fuzz crate dependencies
        # The fuzz crate is its own workspace with its own lockfile. Alloy's
        # optional batteries are off there, so an advisory ignored for them
        # may not be detected.
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml check -A advisory-not-detected

  package:
    name: Package dry run
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CRATES: >-
        ferrum-alloy-diagnostics ferrum-alloy-telemetry ferrum-alloy-edge
        ferrum-alloy ferrum-alloy-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Package every library and CLI crate
        # Nothing is uploaded: `cargo package` never publishes, and every crate
        # stays `publish = false` (docs/release.md). The crates depend on each
        # other and none is in a registry, so Cargo can neither generate a
        # packaged Cargo.lock nor verify a crate against its siblings (it
        # resolves them from crates.io). --exclude-lockfile and --no-verify
        # skip both; the next step builds the packaged sources instead.
        run: |
          set -euxo pipefail
          args=()
          for crate in $CRATES; do
            args+=(-p "$crate")
          done
          cargo package --locked --no-verify --exclude-lockfile "${args[@]}"
      - name: Check the packaged files
        run: |
          set -euxo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "ferrum-alloy") | .version')
          for crate in $CRATES; do
            file="target/package/$crate-$version.crate"
            for path in Cargo.toml README.md LICENSE LICENSE-COMMERCIAL.md; do
              tar -xzOf "$file" "$crate-$version/$path" > /dev/null
            done
            # The license files are symlinks to the repository's; the package
            # must carry their contents.
            tar -xzOf "$file" "$crate-$version/LICENSE" | cmp - LICENSE
            tar -xzOf "$file" "$crate-$version/LICENSE-COMMERCIAL.md" | cmp - LICENSE-COMMERCIAL.md
          done
          # Every committed CLI template ships, including dot-directories.
          diff \
            <(git ls-files crates/ferrum-alloy-cli/templates \
              | sed "s|^crates/ferrum-alloy-cli/|ferrum-alloy-cli-$version/|" | sort) \
            <(tar -tzf "target/package/ferrum-alloy-cli-$version.crate" \
              | grep "^ferrum-alloy-cli-$version/templates/" | grep -v '/$' | sort)
          # The vendored documentation UI ships whole, with its license,
          # notices, and hash manifest.
          diff \
            <(git ls-files crates/ferrum-alloy/assets \
              | sed "s|^crates/ferrum-alloy/|ferrum-alloy-$version/|" | sort) \
            <(tar -tzf "target/package/ferrum-alloy-$version.crate" \
              | grep "^ferrum-alloy-$version/assets/" | grep -v '/$' | sort)
      - name: Build the packaged sources on their own
        # Unpack the packages into a new workspace, outside this one, whose
        # [patch.crates-io] points each registry dependency on a sibling at
        # its unpacked package. This catches a file a crate needs but does not
        # package, such as an include_str! template. The committed lockfile
        # keeps third-party versions as tested.
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/packaged"
          mkdir -p "$root"
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "ferrum-alloy") | .version')
          {
            echo '[workspace]'
            echo 'resolver = "3"'
            echo 'members = ["ferrum-alloy*"]'
            echo '[patch.crates-io]'
          } > "$root/Cargo.toml"
          for crate in $CRATES; do
            tar -xzf "target/package/$crate-$version.crate" -C "$root"
            echo "$crate = { path = \"$crate-$version\" }" >> "$root/Cargo.toml"
          done
          cp Cargo.lock "$root/"
          cat "$root/Cargo.toml"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo check --manifest-path "$root/Cargo.toml" --workspace --all-features
          cargo check --manifest-path "$root/Cargo.toml" --workspace
          # A sibling must resolve to its unpacked package, never to a
          # registry crate of the same name.
          if awk '/^name = /{name=$3} /^source = / && name ~ /^"ferrum-alloy/{found=1} END{exit !found}' \
            "$root/Cargo.lock"; then
            echo "::error::a ferrum-alloy crate resolved from a registry"
            exit 1
          fi

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      FUZZ_TOOLCHAIN: nightly-2026-09-15
      FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check the committed fuzz lockfile
        # cargo-fuzz has no --locked flag. Resolve first and fail, showing the
        # difference, if fuzz/Cargo.lock would change.
        run: |
          cargo "+$FUZZ_TOOLCHAIN" metadata --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
          git diff --exit-code -- fuzz/Cargo.lock
          cargo "+$FUZZ_TOOLCHAIN" fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Build fuzz targets
        run: cargo "+$FUZZ_TOOLCHAIN" fuzz build
      - name: Run each target for ${{ env.FUZZ_SECONDS }} seconds
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE"
          run() {
            target="$1"
            shift
            mkdir -p "$root/fuzz/corpus/$target"
            dict=()
            if [ -f "$root/fuzz/dicts/$target.dict" ]; then
              dict=("-dict=$root/fuzz/dicts/$target.dict")
            fi
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$target" "$root/fuzz/corpus/$target" "$@" -- \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048 "${dict[@]}"
          }
          run traceparent "$root/fuzz/seeds/traceparent"
          run request_id "$root/fuzz/seeds/request_id"
          run diagnostic_report "$root/contracts/fixtures/reports"
          run otlp_import "$root/contracts/fixtures/otlp"
          run config_file "$root/contracts/fixtures/manifests" "$root/fuzz/seeds/config_file"
          run edge_record "$root/fuzz/seeds/edge_record"
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  edge-support:
    name: Edge support window
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.read.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the tested Edge releases
        id: read
        # Every Edge image the jobs below run comes from this list (newest
        # first), so a release bump never edits this workflow. Each entry must
        # be a digest-pinned image with a release tag and full source commit,
        # and gets a stable slot name for the job names: baseline, previous.
        run: |
          set -euo pipefail
          tested=$(jq -ce '.edge_support.tested
            | select(length == 2 and all(.[];
                (.image | test("^ferrumedge/ferrum-edge@sha256:[0-9a-f]{64}\\z"))
                and (.release | test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\z"))
                and (.source_commit | test("^[0-9a-f]{40}\\z"))))
            | [to_entries[] | .value + {slot: (["baseline", "previous"][.key])}]' docs/compatibility.json)
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  edge-e2e:
    name: Ferrum Edge end-to-end (${{ matrix.edge.slot }})
    needs: edge-support
    strategy:
      fail-fast: false
      matrix:
        edge: ${{ fromJSON(needs.edge-support.outputs.tested) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      COMPOSE_FILE: examples/edge-observability/compose.yaml
      # Build argument of the demo Dockerfile's edge stage (compose.yaml).
      EDGE_IMAGE: ${{ matrix.edge.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the driver
        run: cargo build --locked -p example-edge-observability --bin edge-e2e
      - name: Build images (Edge ${{ matrix.edge.release }}, Collector 0.161.0, Alloy)
        run: docker compose -f "$COMPOSE_FILE" build
      - name: ferrum-edge validate (${{ matrix.edge.release }}) on the generated TLS configuration
        run: docker compose -f "$COMPOSE_FILE" run --rm --no-deps edge validate -m file -c /config/edge.yaml
      - name: Start the stack
        run: docker compose -f "$COMPOSE_FILE" up -d
      - name: Verify the Edge to Alloy trace path
        run: ./target/debug/edge-e2e --compose "$COMPOSE_FILE" --out target/e2e
      - name: Service logs
        if: always()
        run: docker compose -f "$COMPOSE_FILE" logs --no-color > target/e2e-logs.txt 2>&1 || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: edge-e2e-evidence-${{ matrix.edge.release }}
          path: |
            target/e2e/
            target/e2e-logs.txt
          if-no-files-found: warn
      - name: Stop the stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  edge-config:
    name: Generated Edge configuration validates (${{ matrix.edge.slot }})
    needs: edge-support
    strategy:
      fail-fast: false
      matrix:
        edge: ${{ fromJSON(needs.edge-support.outputs.tested) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ferrum-edge validate (${{ matrix.edge.release }}) on the plain-HTTP and minimal fixtures
        # minimal.edge.yaml carries the propagation-only otel_tracing plugin
        # export attaches without gateway.otel_endpoint (#307).
        env:
          EDGE_IMAGE: ${{ matrix.edge.image }}
        run: |
          set -euxo pipefail
          for fixture in plain-http minimal; do
            docker run --rm \
              -e FERRUM_NAMESPACE=retail \
              -v "$PWD/contracts/fixtures/manifests:/config:ro" \
              "$EDGE_IMAGE" \
              validate -m file -c "/config/$fixture.edge.yaml"
          done
      - name: Edge (${{ matrix.edge.release }}) strips a caller's trace context through the minimal fixture
        # Runtime proof for #307 (dsf F1): minimal.edge.yaml has no
        # gateway.otel_endpoint, so its otel_tracing plugin is
        # propagation-only. Edge serves the fixture in file mode in front of
        # a header-echo backend on 127.0.0.1:8080 (the fixture's upstream);
        # a client traceparent with the sampled flag and a tracestate must
        # not reach the backend. x-request-id from the correlation_id plugin
        # proves the request went through Edge's plugin chain.
        env:
          EDGE_IMAGE: ${{ matrix.edge.image }}
          EDGE_RELEASE: ${{ matrix.edge.release }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r4-echo-backend.py" <<'PY'
          import http.server
          import json


          class Echo(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({k.lower(): v for k, v in self.headers.items()}).encode()
                  self.send_response(200)
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          http.server.ThreadingHTTPServer(("127.0.0.1", 8080), Echo).serve_forever()
          PY
          python3 "$RUNNER_TEMP/r4-echo-backend.py" &
          echo_pid=$!
          trap 'code=$?; if [ "$code" -ne 0 ]; then docker logs edge-trace || true; fi; docker rm -f edge-trace > /dev/null 2>&1 || true; kill "$echo_pid" 2> /dev/null || true' EXIT
          docker run -d --name edge-trace --network host \
            -e FERRUM_MODE=file \
            -e FERRUM_FILE_CONFIG_PATH=/config/minimal.edge.yaml \
            -e FERRUM_NAMESPACE=retail \
            -e FERRUM_ADMIN_HTTP_PORT=0 \
            -v "$PWD/contracts/fixtures/manifests:/config:ro" \
            "$EDGE_IMAGE" run -m file
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/starter/ready; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' edge-trace)" != true ]; then
              echo "::error::Edge exited before serving the minimal fixture"
              exit 1
            fi
            sleep 1
          done
          seen=$(curl -fsS http://127.0.0.1:8000/starter/items \
            -H 'traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01' \
            -H 'tracestate: attacker=chosen')
          echo "backend received: $seen"
          if ! jq -e 'has("x-request-id")' <<< "$seen" > /dev/null; then
            echo "::error::the request did not pass Edge's plugin chain"
            exit 1
          fi
          if jq -e 'has("traceparent") or has("tracestate")' <<< "$seen" > /dev/null; then
            echo "::error::Edge $EDGE_RELEASE relayed the caller's trace context to the backend"
            exit 1
          fi
      - name: POST /api-specs (${{ matrix.edge.release }}) accepts the exported agent-tool document
        # contracts/fixtures/openapi/orders-api.openapi.json is what
        # `ferrum-alloy openapi export` writes for orders-api.toml's [agents]
        # section (the CLI test openapi_export_stamps_agent_tool_metadata keeps
        # it current). It is submitted the way a publisher does: with an
        # `x-ferrum-proxy` whose listen_path is the exported server URL (the
        # manifest's public_path), and a root server base, since the listen
        # path supplies the mount. /api-specs needs database mode, so Edge
        # runs here with SQLite on a tmpfs and a throwaway admin secret.
        # Every supported release reads x-ferrum-mcp (Edge #5930, first released
        # in v0.9.9): the importer must generate the mcp_gateway with exactly the
        # declared tools (the fixture's undeclared GET /orders/{id}/status must
        # stay unpublished).
        env:
          EDGE_IMAGE: ${{ matrix.edge.image }}
          EDGE_RELEASE: ${{ matrix.edge.release }}
        run: |
          set -euo pipefail
          trap 'code=$?; if [ "$code" -ne 0 ]; then docker logs edge-api-specs || true; fi; docker rm -f edge-api-specs > /dev/null 2>&1 || true' EXIT
          secret=$(openssl rand -hex 32)
          docker run -d --name edge-api-specs \
            -e FERRUM_MODE=database \
            -e FERRUM_DB_TYPE=sqlite \
            -e 'FERRUM_DB_URL=sqlite:///data/ferrum.db?mode=rwc' \
            -e FERRUM_NAMESPACE=ferrum \
            -e FERRUM_ADMIN_JWT_SECRET="$secret" \
            -e FERRUM_ADMIN_BIND_ADDRESS=0.0.0.0 \
            -e FERRUM_ALLOW_INSECURE_ADMIN_HTTP=true \
            --tmpfs /data:rw,mode=1777 \
            -p 127.0.0.1:9000:9000 \
            "$EDGE_IMAGE" run -m database
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/health; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' edge-api-specs)" != true ]; then
              echo "::error::Edge exited before its admin API was ready"
              exit 1
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:9000/health

          # An HS256 admin token with every claim Edge requires.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
          claims=$(jq -cn --argjson now "$now" --arg jti "$(cat /proc/sys/kernel/random/uuid)" \
            '{sub: "alloy-ci", role: "admin", ns: "ferrum", iss: "ferrum-edge",
              iat: ($now - 5), nbf: ($now - 5), exp: ($now + 300), jti: $jti}' | b64url)
          signature=$(printf '%s' "$header.$claims" \
            | openssl dgst -sha256 -hmac "$secret" -binary | b64url)
          token="$header.$claims.$signature"

          spec="$RUNNER_TEMP/orders-api.spec.json"
          jq '. + {"x-ferrum-proxy": {
                id: "orders-api", listen_path: .servers[0].url, strip_listen_path: true,
                backend_scheme: "http", backend_host: "orders.internal", backend_port: 8080}}
              | .servers = [{url: "/"}]' \
            contracts/fixtures/openapi/orders-api.openapi.json > "$spec"
          status=$(curl -sS -o "$RUNNER_TEMP/api-specs.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:9000/api-specs \
            -H "Authorization: Bearer $token" \
            -H 'X-Ferrum-Namespace: ferrum' \
            -H 'Content-Type: application/json' \
            --data-binary "@$spec")
          cat "$RUNNER_TEMP/api-specs.json"
          echo
          if [ "$status" != 201 ]; then
            echo "::error::POST /api-specs answered $status"
            exit 1
          fi

          generated=$(curl -fsS http://127.0.0.1:9000/plugins/config \
            -H "Authorization: Bearer $token" \
            -H 'X-Ferrum-Namespace: ferrum' \
            | jq -c '[.data[] | select(.plugin_name == "mcp_gateway" and .proxy_id == "orders-api")
                | .config | {endpoint: .endpoint.path, namespace: .servers.openapi.namespace,
                  tools: ([.servers.openapi.openapi.operations[].name] | sort)}]')
          echo "generated mcp_gateway: $generated"
          expected='[{"endpoint":"/shop/mcp","namespace":"orders","tools":["create_order","get_order","list_orders"]}]'
          if [ "$generated" != "$expected" ]; then
            echo "::error::expected $expected from Edge $EDGE_RELEASE"
            exit 1
          fi
