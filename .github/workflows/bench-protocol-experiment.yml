name: Benchmark protocol observer experiment

on:
  pull_request:
    paths:
      - 'examples/bench/**'
      - 'crates/ferrum-alloy/src/**'
      - '.github/workflows/bench-protocol-experiment.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: bench-protocol-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Protocol fork experiment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ALLOY_BENCH_DIAGNOSTIC_DIR: ${{ runner.temp }}/alloy-protocol-evidence
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Export exact source into an isolated temporary experiment
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$DIAGNOSTIC_HEAD"
          experiment="$RUNNER_TEMP/alloy-protocol-experiment"
          diagnostic="$RUNNER_TEMP/alloy-protocol-evidence"
          mkdir -p "$experiment/workspace" "$diagnostic"
          git archive HEAD | tar -x -C "$experiment/workspace"
          printf 'ALLOY_BENCH_DIAGNOSTIC_DIR=%s\n' "$diagnostic" >> "$GITHUB_ENV"
          printf 'head=%s\nexpected=%s\nrun=%s\nattempt=%s\njob=%s\nos=%s\nfork=true\nqualification=false\n' \
            "$actual" "$DIAGNOSTIC_HEAD" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_JOB" "$RUNNER_OS" > "$diagnostic/source.txt"
          python examples/bench/diagnostics/prepare.py "$experiment/workspace"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - name: Resolve only the reviewed temporary graph delta
        id: resolve
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: |
          set -euo pipefail
          cargo update -p h2 --precise 0.4.19
          cmp Cargo.lock ../expected-protocol.lock
          cp Cargo.lock "$ALLOY_BENCH_DIAGNOSTIC_DIR/instrumented.lock"
          cp Cargo.toml "$ALLOY_BENCH_DIAGNOSTIC_DIR/instrumented.toml"
          printf 'archive_sha256=%s\nh2_patch_sha256=%s\nobserver_patch_sha256=%s\n' \
            ef8e5e5a340588f4452631496976cf8636d4a7ecf600239fdc27615d2530bc16 \
            "$ALLOY_BENCH_H2_PATCH_SHA256" "$ALLOY_BENCH_OBSERVER_PATCH_SHA256" \
            >> "$ALLOY_BENCH_DIAGNOSTIC_DIR/source.txt"
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: matrix.os == 'ubuntu-latest'
        with:
          tool: cargo-deny
      - name: Check the instrumented dependency policy
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: cargo deny --locked check
      - name: Check experiment source formatting
        id: format
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check \
            "$ALLOY_PROTOCOL_H2/src/alloy_diagnostics.rs" \
            "$ALLOY_PROTOCOL_H2/src/proto/connection.rs" \
            "$ALLOY_PROTOCOL_H2/src/proto/streams/streams.rs" \
            "$ALLOY_PROTOCOL_H2/src/proto/streams/send.rs" \
            "$ALLOY_PROTOCOL_H2/src/proto/streams/prioritize.rs"
      - name: Record all-features dependency graph
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        env:
          ALLOY_BENCH_DIAGNOSTIC_FEATURE: all-features-protocol-fork
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version=1 \
            > "$ALLOY_BENCH_DIAGNOSTIC_DIR/graph-all.json"
          python examples/bench/diagnostics/record-graph.py graph-all.json
          printf 'ALLOY_BENCH_DIAGNOSTIC_FEATURE=all-features-protocol-fork\n' >> "$GITHUB_ENV"
      - name: All-features strict observer controls and lint
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: |
          set -euo pipefail
          cargo clippy --locked -p example-bench --all-targets --all-features -- -D warnings
          cargo test --locked -p example-bench --bin alloy-bench --all-features \
            -- --test-threads=2 --skip serves_every_workload_over_every_transport
      - name: All-features original real matrices once
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: >-
          cargo test --locked -p example-bench --bin alloy-bench --all-features
          serves_every_workload_over_every_transport -- --test-threads=2 --nocapture
      - name: Record default-features dependency graph
        # Run this feature section even if the other real matrix failed.
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' && steps.format.outcome == 'success' }}
        id: default-graph
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version=1 \
            > "$ALLOY_BENCH_DIAGNOSTIC_DIR/graph-default.json"
          python examples/bench/diagnostics/record-graph.py graph-default.json
          printf 'ALLOY_BENCH_DIAGNOSTIC_FEATURE=default-features-protocol-fork\n' >> "$GITHUB_ENV"
      - name: Default-features strict observer controls and lint
        if: ${{ !cancelled() && steps.default-graph.outcome == 'success' }}
        id: default-controls
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: |
          set -euo pipefail
          cargo clippy --locked -p example-bench --all-targets -- -D warnings
          cargo test --locked -p example-bench --bin alloy-bench \
            -- --test-threads=2 --skip serves_every_workload_over_every_transport
      - name: Default-features original real matrices once
        if: ${{ !cancelled() && steps.default-controls.outcome == 'success' }}
        working-directory: ${{ env.ALLOY_PROTOCOL_WORKSPACE }}
        run: >-
          cargo test --locked -p example-bench --bin alloy-bench
          serves_every_workload_over_every_transport -- --test-threads=2 --nocapture
      - name: Record fork outcome
        if: always()
        env:
          EXPERIMENT_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$ALLOY_BENCH_DIAGNOSTIC_DIR"
          printf 'status=%s\nhead=%s\nfork=true\nqualification=false\n' \
            "$EXPERIMENT_STATUS" "$DIAGNOSTIC_HEAD" \
            > "$ALLOY_BENCH_DIAGNOSTIC_DIR/outcome.txt"
      - name: Upload fork provenance and bounded first-failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-protocol-fork-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.ALLOY_BENCH_DIAGNOSTIC_DIR }}/*
          if-no-files-found: warn
          retention-days: 7
