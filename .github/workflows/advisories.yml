name: Advisories

# The CI dependency policy job runs only when a pull request or a push changes
# the tree, so an advisory published against an unchanged lockfile would stay
# invisible until the next change. This re-checks main's lockfiles weekly.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Exercise the workflow itself when it changes.
  pull_request:
    paths:
      - .github/workflows/advisories.yml

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: Dependency advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Workspace
        run: cargo deny --locked check advisories
      - name: Fuzz crate
        if: ${{ !cancelled() }}
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml check -A advisory-not-detected advisories
